name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache minhtml
        id: minhtml-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/minhtml
          key: minhtml-${{ runner.os }}

      - name: Install minhtml
        if: steps.minhtml-cache.outputs.cache-hit != 'true'
        run: cargo install minhtml --locked

      - name: Put cargo binaries on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build
        run: make

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/lib/zpw.min.js
          test -f dist/lib/zpw.min.css
          ls dist/blogs/*.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
